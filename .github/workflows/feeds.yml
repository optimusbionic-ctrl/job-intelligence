name: Hourly job feeds

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 UTC (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:           # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", "feeds/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: QA Intelligence feed
        run: python3 scripts/run_feed.py qa

      - name: Motion Intelligence feed
        run: python3 scripts/run_feed.py mi

      - name: Build pages
        run: python3 scripts/build_pages.py

      - name: Save the updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Feeds update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            git push -q
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
