name: Hourly job feeds

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 UTC (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:           # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", "feeds/**", "inbox/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hiring trends (Naukri JobSpeak, Indeed Hiring Lab, Hacker News; heavy sources refresh daily)
        run: |
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null)
          python3 scripts/trends.py qa || echo "trends qa failed; keeping the last saved figures"
          python3 scripts/trends.py mi || echo "trends mi failed; keeping the last saved figures"

      - name: QA Intelligence feed
        run: python3 scripts/run_feed.py qa
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Motion Intelligence feed
        run: python3 scripts/run_feed.py mi
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Build pages
        run: python3 scripts/build_pages.py

      - name: Save the updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db export research
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Feeds update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            git push -q
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
