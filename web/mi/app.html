<title>Motion Intelligence v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D0E0C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3EEE5" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: ink side rail + glass command bar; pages open on a mono label rail and an editorial headline,
   then hairline tables and grouped key-value panels. The job / company workspace slides in from the right. */
:root{
  /* Ink (default, dark) */
  --bg:#0D0E0C; --side:#111210; --surface:#151614; --raised:#1C1D1A; --hover:#20211E; --sunken:#0A0B09;
  --line:rgba(241,237,228,.09); --line-2:rgba(241,237,228,.16); --line-3:rgba(241,237,228,.26);
  --fg:#F1EDE4; --fg-2:#B9B4A8; --mute:#8E8A80; --faint:#5F5C55;
  --accent:#2F4BFF; --accent-2:#4D66FF; --accent-text:#8A9BFF; --accent-tint:rgba(47,75,255,.16); --accent-line:rgba(77,102,255,.45);
  --accent-grad:linear-gradient(135deg,#4D66FF 0%,#2F4BFF 55%,#2238D6 100%);
  --on-accent:#FFFFFF;
  --bone:#EADFCF; --bone-2:#E0D4C2; --on-bone:#141412; --on-bone-mute:#5E5A52; --bone-line:rgba(20,20,18,.14);
  --good:#7FD1A4; --good-tint:rgba(127,209,164,.12); --warn:#E6B65E; --warn-tint:rgba(230,182,94,.12);
  --bad:#F0907F; --bad-tint:rgba(240,144,127,.12); --info:#86B7EA; --info-tint:rgba(134,183,234,.12);
  --glass:rgba(21,22,20,.72); --scrim:rgba(5,5,4,.62);
  --shadow:0 24px 60px -24px rgba(0,0,0,.7),0 2px 10px rgba(0,0,0,.35);
  --ring-track:rgba(241,237,228,.10);
  --mono-l:38%;
  --f-display:"Bricolage Grotesque","Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-std:cubic-bezier(.4,0,.2,1);
  --r-xs:4px; --r-sm:6px; --r-md:10px; --r-lg:14px;
  --rail:252px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3EEE5; --side:#EAE2D5; --surface:#FBF8F2; --raised:#FFFFFF; --hover:#F1EBE0; --sunken:#E9E2D6;
  --line:rgba(20,20,18,.10); --line-2:rgba(20,20,18,.16); --line-3:rgba(20,20,18,.28);
  --fg:#141412; --fg-2:#4A463F; --mute:#6A655C; --faint:#9A948A;
  --accent:#2F4BFF; --accent-2:#2238D6; --accent-text:#2238D6; --accent-tint:rgba(47,75,255,.10); --accent-line:rgba(47,75,255,.35);
  --bone:#141412; --bone-2:#1C1D1A; --on-bone:#F1EDE4; --on-bone-mute:#B9B4A8; --bone-line:rgba(241,237,228,.14);
  --good:#1F7A4D; --good-tint:rgba(31,122,77,.10); --warn:#8F5F0B; --warn-tint:rgba(143,95,11,.10);
  --bad:#B23A2B; --bad-tint:rgba(178,58,43,.09); --info:#2C62A6; --info-tint:rgba(44,98,166,.09);
  --glass:rgba(251,248,242,.78); --scrim:rgba(20,20,18,.36);
  --shadow:0 24px 60px -28px rgba(40,32,20,.35),0 2px 8px rgba(40,32,20,.08);
  --ring-track:rgba(20,20,18,.10);
  --mono-l:46%;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F3EEE5; --side:#EAE2D5; --surface:#FBF8F2; --raised:#FFFFFF; --hover:#F1EBE0; --sunken:#E9E2D6;
  --line:rgba(20,20,18,.10); --line-2:rgba(20,20,18,.16); --line-3:rgba(20,20,18,.28);
  --fg:#141412; --fg-2:#4A463F; --mute:#6A655C; --faint:#9A948A;
  --accent:#2F4BFF; --accent-2:#2238D6; --accent-text:#2238D6; --accent-tint:rgba(47,75,255,.10); --accent-line:rgba(47,75,255,.35);
  --bone:#141412; --bone-2:#1C1D1A; --on-bone:#F1EDE4; --on-bone-mute:#B9B4A8; --bone-line:rgba(241,237,228,.14);
  --good:#1F7A4D; --good-tint:rgba(31,122,77,.10); --warn:#8F5F0B; --warn-tint:rgba(143,95,11,.10);
  --bad:#B23A2B; --bad-tint:rgba(178,58,43,.09); --info:#2C62A6; --info-tint:rgba(44,98,166,.09);
  --glass:rgba(251,248,242,.78); --scrim:rgba(20,20,18,.36);
  --shadow:0 24px 60px -28px rgba(40,32,20,.35),0 2px 8px rgba(40,32,20,.08);
  --ring-track:rgba(20,20,18,.10);
  --mono-l:46%;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-kerning:normal;font-feature-settings:"kern" 1,"liga" 1,"calt" 1;font-optical-sizing:auto;-webkit-text-size-adjust:100%;text-size-adjust:100%}
p,li,dd,.note,.callout,.empty p{text-wrap:pretty}
a,button,[role=button],label,summary,input,select{touch-action:manipulation}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent);color:#fff}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--mute)}
em.ser{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.005em;font-size:1.06em;line-height:.9;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;line-height:1.4;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:400}
.scroll-x{overflow-x:auto}
.prose{white-space:pre-wrap;font-size:13px;color:var(--fg-2);line-height:1.6;max-width:72ch}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:18px 14px 16px;background:var(--side);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 6px}
.brand b{display:block;font-family:var(--f-display);font-weight:650;font-size:15.5px;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav .grp:first-child{padding-top:2px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--fg-2);font-size:13.5px;font-weight:500;transition:background .2s var(--ease-std),color .2s var(--ease-std)}
.nav a:hover{background:var(--hover);color:var(--fg);text-decoration:none}
.nav a[aria-current="page"]{background:var(--raised);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.nav a[aria-current="page"]::after{content:"";position:absolute;right:10px;width:7px;height:7px;background:var(--accent);transform:rotate(45deg);border-radius:1px}
.nav a[aria-current="page"] .count,.nav a[aria-current="page"] .dot{margin-right:14px}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.nav .dot{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:10.5px;font-family:var(--f-mono);display:grid;place-items:center}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.monitor-mini{display:flex;flex-direction:column;gap:3px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:12px}
.monitor-mini .row{display:flex;align-items:center;gap:8px}
.monitor-mini b{font-weight:600;font-size:12.5px}
.monitor-mini .muted{font-family:var(--f-mono);font-size:10.5px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:breathe 2.6s var(--ease-std) infinite;flex:none}
.pulse.off{background:var(--faint);animation:none}
@keyframes breathe{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.theme-toggle,.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line);border-radius:999px;background:var(--sunken)}
.theme-toggle{display:flex}
.theme-toggle button,.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:12px;color:var(--mute);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.theme-toggle button:hover,.seg button:hover{color:var(--fg)}
.theme-toggle button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.25),inset 0 0 0 1px var(--line)}
.seg button[aria-pressed="true"]::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 28px;max-width:1440px}
.mobile-brand{display:none}
.cmd{flex:1;max-width:760px;display:flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 16px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);transition:border-color .2s,box-shadow .2s}
.cmd:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-tint)}
.cmd input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:13.5px}
.cmd input::placeholder{color:var(--faint)}
.cmd kbd{font-family:var(--f-mono);font-size:11px;color:var(--mute);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px}
.cmd .go{border:0;border-radius:999px;height:30px;padding:0 13px;background:var(--accent-grad);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ai-tag{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text)}
.top-actions{display:flex;gap:6px;margin-left:auto;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line-2);font-family:var(--f-display);font-weight:600;font-size:12px;color:var(--fg)}
.avatar:hover{text-decoration:none;border-color:var(--line-3)}
.content{flex:1}
.content-in{max-width:1440px;padding:32px max(16px,env(safe-area-inset-right,0px)) 120px 28px;display:flex;flex-direction:column;gap:22px}

/* ---------- page head ---------- */
.page-head{display:flex;flex-wrap:wrap;gap:18px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:4px}
.page-head>div:first-child{display:flex;flex-direction:column;gap:10px;max-width:820px;min-width:0}
.page-head h1{font-size:clamp(28px,3.1vw,42px);line-height:1.06;font-weight:650;letter-spacing:-.032em;font-variation-settings:"opsz" 96}
.page-head p{color:var(--fg-2);font-size:14.5px;line-height:1.55;max-width:68ch}
.hero h1{font-size:clamp(34px,4.4vw,60px);line-height:1.02;letter-spacing:-.038em}
.dr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- buttons, pills, fields ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-size:13px;font-weight:550;cursor:pointer;white-space:nowrap;transition:background .2s var(--ease-std),border-color .2s,transform .2s var(--ease-out)}
.btn:hover{background:var(--hover);border-color:var(--line-3);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent-grad);border-color:transparent;color:#fff;box-shadow:0 6px 20px -8px rgba(47,75,255,.7)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:30px;padding:0 11px;font-size:12px}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.sm.icon{width:30px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{flex:none;fill:currentColor}
.btn svg.kfi{fill:transparent;stroke:currentColor;stroke-width:1.6}
.btn svg.kfi.on{fill:var(--accent-2);stroke:var(--accent-2)}
.btn.primary svg.kfi{fill:#fff;stroke:#fff}
.drawer:focus{outline:none}
dd.emails{display:flex;flex-direction:column;gap:6px}
.erow-in{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:550;white-space:nowrap;border:1px solid transparent;vertical-align:middle;line-height:1}
.pill.good{background:var(--good-tint);color:var(--good)}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.bad{background:var(--bad-tint);color:var(--bad)}
.pill.info{background:var(--info-tint);color:var(--info)}
.pill.accent{background:var(--accent-tint);color:var(--accent-text)}
.pill.plain{background:var(--raised);color:var(--fg-2);border-color:var(--line)}
.pill.outline{border-color:var(--line-2);color:var(--fg-2)}
.pill.num{font-family:var(--f-mono);font-weight:500}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:var(--r-xs);border:1px solid var(--line);background:var(--raised);color:var(--fg-2);font-size:11px;white-space:nowrap}
.input,.select,.textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;font-size:13px;transition:border-color .2s,box-shadow .2s}
.input,.select{height:36px}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.textarea{min-height:120px;resize:vertical;line-height:1.55}
.input:focus,.select:focus,.textarea:focus{outline:0;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-tint)}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--fg-2);font-weight:500}
.check{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--fg-2);padding:4px 0;cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0;flex:none}
.check .c{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
.note{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--mute);line-height:1.5}
.note svg{flex:none;margin-top:2px}
kbd{font-family:var(--f-mono)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2,.panel-h h3{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.panel-h .eyebrow{display:block;margin-bottom:3px}
.panel-b{padding:16px 20px}
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid{display:flex;flex-direction:column;gap:18px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{font-family:var(--f-display);font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3;color:var(--fg)}
.callout{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--raised);font-size:13px;color:var(--fg-2)}
.callout b{color:var(--fg)}
.callout.accent{border-color:var(--accent-line);background:linear-gradient(180deg,var(--accent-tint),transparent 140%)}
.callout.warn{border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-tint)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:44px 20px;color:var(--mute)}
.empty h3{font-size:17px;color:var(--fg)}
.empty p{max-width:52ch;font-size:13px}
.skel{border-radius:6px;background:linear-gradient(90deg,var(--raised) 0%,var(--hover) 50%,var(--raised) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
dl.kv{display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px 16px;margin:0;font-size:13px;line-height:1.5}
dl.kv dt{color:var(--mute);font-size:12.5px;font-weight:450}
dl.kv dd{margin:0;color:var(--fg);min-width:0;overflow-wrap:anywhere}
ul.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--fg-2)}
ul.list.why li::marker{content:"◆  ";color:var(--good);font-size:9px}
ul.list.con li::marker{content:"◆  ";color:var(--warn);font-size:9px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 12px;font-size:13px;line-height:1.3;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button .n{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);margin-left:5px}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.kpi{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:18px 20px 20px;cursor:pointer;border-right:1px solid var(--line);position:relative;transition:background .25s var(--ease-std)}
.kpi:last-child{border-right:0}
.kpi:hover{background:var(--hover)}
.kpi:focus-visible{outline:2px solid var(--accent-2);outline-offset:-2px}
.kpi .k{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute)}
.kpi .v{font-family:var(--f-display);font-size:38px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;font-variation-settings:"opsz" 96}
.kpi .s{font-size:12px;color:var(--mute)}
.kpi::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease-out)}
.kpi:hover::after{transform:scaleX(1)}

/* ---------- rows, monograms, fit ---------- */
.mono-logo{width:34px;height:34px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:-.02em;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.list-rows{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:11px 8px;margin:0 -8px;border-radius:var(--r-sm);cursor:pointer;border-bottom:1px solid var(--line);transition:background .2s}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--hover)}
.role{min-width:0;display:flex;flex-direction:column;gap:3px}
.role b{font-weight:600;font-size:13.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.003em}
.role small{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;color:var(--mute)}
.status-dot{width:7px;height:7px;border-radius:50%;flex:none}
.fit{position:relative;flex:none;width:38px;height:38px}
.fit.lg{width:64px;height:64px}
.fit svg{position:absolute;inset:0;display:block;transform:rotate(-90deg)}
.fit span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11.5px;font-weight:500;line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;padding-top:.5px}
.fit.lg span{font-size:18px;font-family:var(--f-display);font-weight:600}
table.jobs td.c-fit .fit,table.jobs td.c-fit{text-align:center}
table.jobs td.c-fit .fit{margin:0 auto}
table.jobs th.c-fit{text-align:center}
table.jobs .c-act{padding-left:10px;padding-right:10px;text-align:center}
.verif{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.verif small{font-size:11.5px;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.verif .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pay{display:flex;flex-direction:column;gap:1px;min-width:0}
.jobs td .pay{max-width:170px}
.pay b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pay small,.age small,.where small{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where small{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.pay.est b{color:var(--fg-2);font-weight:500}
.age{display:flex;flex-direction:column;font-family:var(--f-mono);font-size:12px}
.age small{font-family:var(--f-body)}
.where{display:flex;flex-direction:column;gap:4px;font-size:12.5px;min-width:0}
.elig{display:flex;flex-direction:column;gap:5px;min-width:0}
.elig .co{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);white-space:nowrap}
.vglyph{width:8px;height:8px;transform:rotate(45deg);border-radius:1.5px;flex:none;border:1.5px solid currentColor}
.vglyph.yes{background:var(--good);border-color:var(--good)}
.vglyph.likely{background:var(--info);border-color:var(--info)}
.vglyph.no{background:transparent;border-color:var(--bad)}
.vglyph.unclear,.vglyph.none{background:transparent;border-color:var(--faint)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.jobs,table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.jobs{min-width:1080px;table-layout:fixed}
table.jobs td{overflow:hidden}
table.jobs thead th,table.tbl thead th{position:sticky;top:0;background:var(--surface);text-align:left;font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.jobs td,table.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tbody th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.jobs tbody tr:last-child td{border-bottom:0}
table.jobs tbody tr{cursor:pointer;background-image:linear-gradient(90deg,var(--accent-tint),var(--accent-tint));background-repeat:no-repeat;background-size:0% 100%;transition:background-size .5s var(--ease-out)}
table.jobs tbody tr:hover{background-size:100% 100%}
table.jobs tbody tr.sel{background-size:100% 100%;box-shadow:inset 2px 0 0 var(--accent)}
table.jobs tbody tr.closed{opacity:.5}
table.jobs.dense td{padding-block:8px}
.rc{display:flex;gap:12px;align-items:center;min-width:0}
.rc .role b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.co-l{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co{display:flex;gap:11px;align-items:center}
.co .nm{display:flex;flex-direction:column;min-width:0}
.co .nm b{font-weight:600}
.co .nm span{font-size:11.5px;color:var(--mute)}

/* ---------- save keyframe ---------- */
.kf{width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--faint);transition:color .2s,background .2s}
.kf:hover{background:var(--hover);color:var(--fg)}
.kf svg use{fill:transparent;stroke:currentColor;stroke-width:1.6}
.kf svg{fill:transparent;stroke:currentColor;stroke-width:1.6;transition:transform .3s var(--ease-out)}
.kf[aria-pressed="true"]{color:var(--accent-2)}
.kf[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent)}
.kf.pop svg{animation:kfpop .45s var(--ease-out)}
@keyframes kfpop{0%{transform:scale(.6) rotate(-45deg)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ---------- explorer ---------- */
.explorer{display:flex;flex-direction:column;gap:14px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fpw{position:relative}
.fpill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;color:var(--fg-2);cursor:pointer;white-space:nowrap;transition:border-color .2s,background .2s}
.fpill:hover{border-color:var(--line-3);color:var(--fg)}
.fpill b{font-weight:600;color:var(--fg)}
.fpill.on{border-color:var(--accent-line);background:var(--accent-tint);color:var(--fg)}
.fpill svg.chev{transform:rotate(90deg);opacity:.7}
.fpill[aria-expanded="true"] svg.chev{transform:rotate(-90deg)}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:260px;max-width:min(340px,calc(100vw - 32px));max-height:420px;overflow:auto;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow);animation:popin .22s var(--ease-out)}
.pop .ph{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.pop .hint{font-size:11.5px;color:var(--mute);margin-top:6px}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}}
.results-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.results-bar .left{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.results-bar h2{font-size:22px;font-weight:600;letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px 6px;min-height:26px;padding:3px 6px 3px 10px;border-radius:999px;background:var(--raised);border:1px solid var(--line);font-size:12px;color:var(--mute)}
.chip b{color:var(--fg);font-weight:550}
.chip button{width:18px;height:18px;border:0;border-radius:50%;background:transparent;color:var(--mute);display:grid;place-items:center;cursor:pointer}
.chip button:hover{background:var(--hover);color:var(--fg)}
.chip.ai{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent-text)}
.chip:not(:has(button)){padding-right:10px}
.ai-explain{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-md);border:1px solid var(--accent-line);background:var(--accent-tint);font-size:13px;color:var(--fg-2)}
.ai-explain svg{color:var(--accent-text);flex:none;margin-top:2px}
.ai-explain b{color:var(--fg)}
.filters{overscroll-behavior:contain;position:fixed;top:0;bottom:0;right:0;z-index:62;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:none;box-shadow:var(--shadow)}
.filters.open{display:block;animation:slidein .35s var(--ease-out)}
.fgroup{border-bottom:1px solid var(--line);padding:12px 0}
.fgroup>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600}
.fgroup>summary::-webkit-details-marker{display:none}
.fgroup>summary svg{margin-left:auto;transition:transform .25s var(--ease-out);color:var(--mute)}
.fgroup[open]>summary svg{transform:rotate(90deg)}
.fgroup .n{font-family:var(--f-mono);font-size:10.5px;color:var(--accent-text);font-weight:400}
.fgroup .opts{display:flex;flex-direction:column;padding-top:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.jcard{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);cursor:pointer;transition:border-color .25s,transform .35s var(--ease-out)}
.jcard:hover{border-color:var(--line-3);transform:translateY(-2px)}
.jcard.closed{opacity:.5}
.jcard .top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
.jcard .top .role b{white-space:normal}
.jcard .meta{display:flex;flex-wrap:wrap;gap:6px}
.jcard .sn{font-size:12.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.jcard .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}

/* ---------- charts ---------- */
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;height:170px;align-items:end}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{display:block;width:100%;max-width:38px;min-height:2px;border-radius:4px 4px 1px 1px;background:var(--accent-grad)}
.bars .b i.dim{background:color-mix(in srgb,var(--accent) 40%,var(--raised))}
.bars .b em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--fg-2)}
.bars .b span{font-family:var(--f-mono);font-size:10px;color:var(--faint);white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 34px;gap:12px;align-items:center;padding:6px 0;font-size:12.5px;border-radius:6px}
.hbar[role=button]{cursor:pointer}
.hbar[role=button]:hover .lb{color:var(--fg)}
.hbar .lb{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{height:6px;border-radius:999px;background:var(--ring-track);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:999px;background:var(--accent-2)}
.hbar .n{text-align:right;font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.scores{display:flex;flex-direction:column;gap:9px}
.srow{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) 34px 48px;gap:12px;align-items:center;font-size:12.5px}
.srow .lbl{color:var(--fg-2)}
.srow .track{height:6px;border-radius:999px;background:var(--ring-track);overflow:hidden}
.srow .track i{display:block;height:100%;background:var(--accent-grad);border-radius:999px}
.srow .v{font-family:var(--f-mono);text-align:right}
.srow .w{font-family:var(--f-mono);font-size:11px;color:var(--faint);text-align:right}
.vbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--ring-track);gap:2px}
.vbar i{display:block;height:100%}
.vbar i.yes{background:var(--good)} .vbar i.likely{background:var(--info)} .vbar i.no{background:var(--bad)} .vbar i.unclear{background:var(--faint)}
.vlegend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}
.vlegend button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--line);cursor:pointer;transition:background .2s,border-color .2s}
.vlegend button:hover{background:var(--hover);border-color:var(--line-2)}
.vlegend button:focus-visible{outline:2px solid var(--accent-2)}
.vlegend .lb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-2)}
.vlegend .nm{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* ---------- India hiring verdict ---------- */
.verdict{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px 0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid}
.verdict.yes{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:var(--good-tint)}
.verdict.likely{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent);background:var(--info-tint)}
.verdict.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-tint)}
.verdict.unclear,.verdict.none{color:var(--mute);border-color:var(--line-2);background:transparent}
.vcard{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:var(--r-lg);border:1px solid var(--line-2);background:var(--raised)}
.vcard .vh{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.vcard .vs{font-family:var(--f-display);font-size:18px;font-weight:550;letter-spacing:-.02em;line-height:1.3}
.evid{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.evid .e{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.evid .e:last-child{border-bottom:0}
.evid .e .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.evid .e b{font-weight:600;color:var(--fg)}
.evid .e .d{color:var(--mute);overflow-wrap:anywhere}
.evid .mk{width:9px;height:9px;transform:rotate(45deg);border-radius:1.5px;margin:5px 0 0 5px}
.evid .mk.pos{background:var(--good)} .evid .mk.mid{background:var(--info)} .evid .mk.neg{background:var(--bad)} .evid .mk.neu{background:var(--faint)}
.boardline{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.boardline b{color:var(--fg);font-weight:500}

/* ---------- bone band ---------- */
.band{border-radius:var(--r-lg);background:var(--bone);color:var(--on-bone);padding:28px 28px 30px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px}
.band .eyebrow{color:var(--on-bone-mute)}
.band h2{font-size:clamp(22px,2.4vw,32px);line-height:1.1;letter-spacing:-.03em}
.band p{color:var(--on-bone-mute);font-size:13.5px;max-width:62ch}
.band .figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--bone-line);margin-top:18px}
.band .fig{padding:16px 18px 0 0;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--bone-line);margin-right:18px}
.band .fig:last-child{border-right:0;margin-right:0}
.band .fig b{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.035em;line-height:1}
.band .fig span{font-size:12px;color:var(--on-bone-mute)}
.band a{color:inherit;text-decoration:underline;text-underline-offset:3px}

/* ---------- people, tracker, sources ---------- */
.contact{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.contact .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line-2);font-family:var(--f-display);font-weight:600;font-size:13px}
.contact .bd{display:flex;flex-direction:column;gap:6px;min-width:0}
.contact .t{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.contact .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.board{display:grid;grid-template-columns:repeat(7,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0;padding:10px;border-radius:var(--r-lg);background:var(--side);border:1px solid var(--line);transition:border-color .2s,background .2s}
.col.drop{border-color:var(--accent-line);background:var(--accent-tint)}
.col-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:2px 4px}
.col-h .n{color:var(--fg)}
.col-b{display:flex;flex-direction:column;gap:8px;min-height:60px}
.tcard{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);cursor:grab;font-size:12.5px}
.tcard:hover{border-color:var(--line-3)}
.tcard b{font-weight:600;font-size:13px}
.src{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.src:last-child{border-bottom:0}
.src .ic{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--raised);border:1px solid var(--line);color:var(--fg-2);flex:none}

/* ---------- drawer, modal, compare, toasts ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;animation:fade .25s var(--ease-std);backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(760px,100%);background:var(--surface);border-left:1px solid var(--line-2);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slidein .42s var(--ease-out)}
@keyframes slidein{from{transform:translateX(36px);opacity:0}}
.dr-head{padding:20px 24px 0;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px;border-bottom:1px solid var(--line);background:var(--surface)}
.dr-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:start}
.dr-top .mono-logo{width:44px;height:44px;font-size:15px}
.dr-top h2{font-size:21px;line-height:1.2;font-weight:650;letter-spacing:-.022em}
.dr-top .sub{display:flex;flex-wrap:wrap;gap:4px 7px;font-size:12.5px;color:var(--mute);margin-top:5px}
.dr-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:22px 24px calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:28px}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal-card{width:min(1080px,100%);max-height:calc(100dvh - 48px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);animation:popin .3s var(--ease-out)}
.modal-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.modal-h b{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.02em}
.compare-bar{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:999px;background:var(--fg);color:var(--bg);box-shadow:var(--shadow);font-size:13px;font-weight:550}
.compare-bar .btn:not(.primary){color:var(--bg);border-color:transparent}
.toasts{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}

  const name = (k, v) => k === 'india' ? INDIA_META[v]?.label : k === 'status' ? STATUS_META[v]?.label : k === 'comp' ? BAND_LABEL[v] : k === 'tiers' ? ({ 1: 'Tier 1', 2: 'Tier 2', 3: 'Other tier' }[v]) : k === 'compState' ? ({ verified: 'Listed pay', reported: 'Reported pay', unavailable: 'Undisclosed pay' }[v]) : k === 'csize' ? (v === 'unknown' ? 'Size not published' : v) : k === 'recruit' ? ({ named: 'Named contact', manager: 'Hiring manager', email: 'Public email', multi: '2+ contacts', official: 'Official apply link' }[v]) : k === 'mode' ? ({ remote: 'Remote', hybrid: 'Hybrid', onsite: 'On-site', unspecified: 'Arrangement not stated' }[v]) : k === 'cohire' ? 'Employer: ' + (VERDICT_META[v]?.label || v).toLowerCase() : v;
  out.push(`<span class="chip"><span>Posted</span><b>${`≤ ${Math.min(f.days, MAX_DAYS) === 1 ? '24h' : Math.min(f.days, MAX_DAYS) + 'd'}`}</b>${f.days !== 30 ? `<button data-act="chip-x" data-k="days" aria-label="Reset freshness">${ico('i-x', 10)}</button>` : ''}</span>`);
  for (const k of ['india', 'cohire', 'status', 'mode', 'cities', 'tiers', 'cats', 'csize', 'comp', 'compState', 'seniority', 'employment', 'specs', 'recruit']) {
    if (!(f[k] || []).length) continue;
    const same = JSON.stringify([...f[k]].sort()) === JSON.stringify([...d[k]].sort());
    if (same && (k === 'india' || k === 'status')) { out.push(`<span class="chip"><span>${k === 'india' ? 'This role' : 'Listings'}</span><b>${f[k].map(v => name(k, v)).join(' + ')}</b></span>`); continue; }
    for (const v of f[k]) out.push(`<span class="chip ${S.nl?.keys?.includes(k) ? 'ai' : ''}"><b>${esc(name(k, v))}</b><button data-act="chip-x" data-k="${k}" data-v="${esc(v)}" aria-label="Remove ${esc(name(k, v))}">${ico('i-x', 10)}</button></span>`);
  }
  if (f.potential35) out.push(`<span class="chip ${S.nl?.keys?.includes('potential35') ? 'ai' : ''}"><b>₹35 LPA+ potential</b><button data-act="chip-x" data-k="potential35" aria-label="Remove">${ico('i-x', 10)}</button></span>`);

  for (const k of f.kw) out.push(`<span class="chip ai">${ico('i-spark', 11)}<b>${esc(k)}</b><button data-act="chip-x" data-k="kw" data-v="${esc(k)}" aria-label="Remove keyword">${ico('i-x', 10)}</button></span>`);
  return out.join('');
}

const AI_ERR = { not_granted: 'Claude access was declined for this page. Allow it from the artifact’s permissions to use AI features.', rate_limited: 'Too many Claude requests right now. Try again in a minute.', session_expired: 'Your Claude session expired. Sign in again.', refused: 'Claude declined that request. Rephrase it.', invalid_json: 'Claude’s answer could not be read. Try again.', prompt_too_large: 'That was too much text to send. Use a shorter excerpt.', sampling_disabled: 'Claude is not available for this account.', upstream_error: 'Claude could not be reached. Try again.' };
const aiErr = e => AI_ERR[e?.code] || 'Claude could not complete that. Try again.';
function profileBrief() {
  const p = profile();
  return `Candidate: ${p.name}, ${p.headline}, ${p.years}+ years, based in ${p.location}. Experience: ${(p.experience || []).map(e => `${e.company} (${e.role})`).join('; ')}. Tools: ${(p.tools || []).join(', ')}. Specialisations: ${(p.specializations || []).join(', ')}. AI tools: ${(p.ai_tools || []).join(', ')}. Summary: ${p.summary}. Portfolio: ${Object.values(p.links || {}).join(', ')}. Target pay above ₹${p.target_lpa} LPA.`;
}
function localParse(q) {
  const s = q.toLowerCase(); const f = {}; const keys = [];
  const m = s.match(/(?:last|past|within)\s+(\d+)\s*(day|d|week|w|month|mo)/); if (m) { const n = +m[1]; f.days = m[2].startsWith('w') ? n * 7 : m[2].startsWith('m') ? n * 30 : n; keys.push('days'); }
  if (/24 ?h|today/.test(s)) { f.days = 1; keys.push('days'); }
  const lp = s.match(/(\d{2,3})\s*(?:lpa|lakh|l\b)/); if (lp) { const v = +lp[1]; f.comp = Object.keys(BANDS).filter(b => BANDS[b][1] > v * 1e5); f.compState = []; keys.push('comp'); }
  if (/remote/.test(s)) { f.mode = ['remote']; keys.push('mode'); }
  if (/hybrid/.test(s)) { f.mode = [...(f.mode || []), 'hybrid']; keys.push('mode'); }
  if (/from india|india remote|remote.*india|open to india/.test(s)) { f.india = ['confirmed', 'likely']; keys.push('india'); }
  if (/hires? (from |in )?india|hire indians?|hiring indians?|accept indian|employer.*india/.test(s)) { f.cohire = ['yes', 'likely']; keys.push('cohire'); }
  for (const c of MAIN_CITIES) if (s.includes(c.toLowerCase()) || (c === 'Bengaluru' && s.includes('bangalore'))) { f.cities = [...(f.cities || []), c]; keys.push('cities'); }
  const cats = []; if (/\bai\b/.test(s)) cats.push('AI'); if (/saas/.test(s)) cats.push('SaaS'); if (/fintech/.test(s)) cats.push('Fintech'); if (/dev ?tools|developer/.test(s)) cats.push('Developer tools'); if (/crypto|web3/.test(s)) cats.push('Crypto / Web3');
  if (cats.length) { f.tiers = ['1']; keys.push('tiers'); }
  if (/agency|studio/.test(s)) { f.tiers = ['2']; keys.push('tiers'); }
  if (/senior|sr\b/.test(s)) { f.seniority = ['Senior', 'Lead / Manager', 'Staff / Principal', 'Not stated']; keys.push('seniority'); }
  if (/contract/.test(s)) { f.employment = ['contract']; keys.push('employment'); } else if (/full[- ]?time/.test(s)) { f.employment = ['full-time']; keys.push('employment'); }
  const kw = []; for (const w of ['product motion', 'rive', 'lottie', 'ui motion', '3d', 'brand', 'creative technologist', 'micro-interaction', 'explainer', 'launch', 'after effects', 'generative']) if (s.includes(w)) kw.push(w);
  return { filters: f, kw, expand: cats, keys, explain: `${Object.keys(f).length} filters and ${kw.length} keywords picked out of your words`, source: 'local' };
}
async function nlSearch(q) {
  q = q.trim(); if (!q) { clearNl(); return; }
  location.hash = 'explorer';
  const cats = [...new Set([...S.jobs.values()].map(j => j.category))];
  let parsed = null;
  if (S.caps.sample) {
    S.nl = { explain: 'Reading your search…', source: 'claude', terms: [] }; scheduleRender();
    const prompt = `Convert this job-search request into filters for a motion-design job tracker. Today is ${new Date().toISOString().slice(0, 10)}.
Request: """${q}"""
Reply with only one JSON object using these keys (omit keys the request does not mention):
{"days": one of 1,3,7,14,30,45 (45 is the maximum),
 "india": subset of ["confirmed","likely","unconfirmed","relocation"]  (confirmed = India-based or India listed; likely = worldwide remote; "remote from India" means ["confirmed","likely"]),
 "cohire": subset of ["yes","likely","no","unclear"]  (employer-level check: yes = employer hires people in India, likely = hires globally; "companies that hire Indians" means ["yes","likely"]),
 "mode": subset of ["remote","hybrid","onsite"],
 "cities": subset of ${JSON.stringify([...MAIN_CITIES, 'Other India'])},
 "tiers": subset of ["1","2","3"] (1 = product/software companies, 2 = agencies/studios),
 "cats": subset of ${JSON.stringify(cats)},
 "seniority": subset of ${JSON.stringify([...new Set(Object.values(SEN_GROUP))])},
 "employment": subset of ["full-time","contract","freelance","part-time"],
 "comp": subset of ["35-45","45-60","60-80","80+"] (INR lakh per annum bands; "above 45 LPA" means ["45-60","60-80","80+"]),
 "potential35": true if they want roles that could pay ₹35 LPA or more,
 "status": subset of ["verified","active","lead","closed"],
 "specs": subset of ${JSON.stringify(SPECS)},
 "minFit": integer 0-95,
 "keywords": up to 6 short phrases that must appear in a matching posting (titles, tools, domains),
 "expand": up to 10 related terms that should raise relevance (synonyms, tools, adjacent role names),
 "sort": one of ${JSON.stringify(SORTS.map(s => s[0]))},
 "explain": one plain sentence describing how you read the request}`;
    try { const r = await S.caps.sample.json(prompt, { modelTier: 'quick' }); if (r && typeof r === 'object') parsed = { ...r, source: 'claude' }; }
    catch (e) { if (e?.code !== 'cancelled') toast(aiErr(e) + ' Using the built-in parser.'); }
  }
  if (!parsed) { const l = localParse(q); parsed = { ...l.filters, keywords: l.kw, expand: l.expand, explain: l.explain, source: 'local', _keys: l.keys }; }
  const f = DEFAULT_FILTERS(); const keys = [];
  const take = (k, valid) => { if (parsed[k] == null) return; const v = Array.isArray(parsed[k]) ? parsed[k].map(String).filter(x => !valid || valid.includes(x)) : parsed[k]; if (Array.isArray(v) && !v.length) return; f[k] = v; keys.push(k); };
  take('india', Object.keys(INDIA_META)); take('cohire', ['yes', 'likely', 'no', 'unclear']); take('mode', ['remote', 'hybrid', 'onsite']); take('cities', [...MAIN_CITIES, 'Other India']); take('tiers', ['1', '2', '3']); take('cats', cats);
  take('seniority', [...new Set(Object.values(SEN_GROUP))]); take('employment', ['full-time', 'contract', 'freelance', 'part-time']); take('comp', Object.keys(BANDS)); take('status', Object.keys(STATUS_META)); take('specs', SPECS);
  if ([1, 3, 7, 14, 30, 45].includes(+parsed.days)) { f.days = +parsed.days; keys.push('days'); }
  if (parsed.potential35 === true) { f.potential35 = true; keys.push('potential35'); }
  if (Number.isFinite(+parsed.minFit) && +parsed.minFit > 0) f.minFit = Math.min(95, Math.round(+parsed.minFit / 5) * 5);
  f.kw = (parsed.keywords || []).map(String).slice(0, 6); f.expand = (parsed.expand || []).map(String).slice(0, 10);
  if (SORTS.some(s => s[0] === parsed.sort)) S.sort = parsed.sort;
  S.filters = f; S.page = 1;
  S.nl = { explain: String(parsed.explain || ''), source: parsed.source, keys: parsed._keys || keys, terms: [...f.kw, ...f.expand].slice(0, 12), q };
  withTransition(render);
}

      if (await saveDoc(wsRef('profile'), next, 'Profile saved')) $('#modalRoot').innerHTML = ''; break; }
    case 'search': { if (!requireWs()) break; const sid = 's' + Date.now().toString(36); const rec = { name: fd.name, filters: S.filters, sort: S.sort, query: S.nl?.q || '', created_at: new Date().toISOString() }; S.ws.searches.set(sid, rec); if (await saveDoc(wsCol('searches').doc(sid), rec, 'Search saved')) $('#modalRoot').innerHTML = ''; break; }
    case 'watch': { if (!requireWs()) break; const ats = parseAts(fd.url); const slug = (fd.name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); if (!slug) break;
      const rec = { name: fd.name, slug, ats, careers: safeUrl(fd.url), added_at: new Date().toISOString() }; S.ws.watch.set(slug, rec); if (await saveDoc(wsCol('watchlist').doc(slug), rec, ats ? `Watching ${fd.name} (${ats.type} board)` : `Watching ${fd.name}`)) $('#modalRoot').innerHTML = ''; break; }
  }
});
function parseAts(u) {
  const url = safeUrl(u); if (!url) return null; const x = new URL(url); const seg = x.pathname.split('/').filter(Boolean);
  if (/greenhouse\.io$/.test(x.hostname)) return seg[0] ? { type: 'greenhouse', slug: seg[0] } : null;
  if (x.hostname === 'jobs.ashbyhq.com') return seg[0] ? { type: 'ashby', slug: decodeURIComponent(seg[0]) } : null;
  if (x.hostname === 'jobs.lever.co') return seg[0] ? { type: 'lever', slug: seg[0] } : null;
  if (x.hostname === 'jobs.smartrecruiters.com') return seg[0] ? { type: 'smartrecruiters', slug: seg[0] } : null;
  return null;
}
